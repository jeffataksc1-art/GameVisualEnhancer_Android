plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gamevisualenhancer.android'
    compileSdk 35

    defaultConfig {
        applicationId 'com.gamevisualenhancer.android'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'

        // POCO X6 Pro is an ARM64 device; no native libraries are required by this app.
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}']
        }
    }
}
